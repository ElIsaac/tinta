[package]
name = "spenmouse-receiver"
version = "0.1.0"
edition = "2021"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[profile.release]
lto = true
panic = "abort"
